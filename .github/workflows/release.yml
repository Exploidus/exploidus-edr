name: Build & Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[full]"

      - name: Build Standalone Windows GUI Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "exploidus-edr-gui" `
            --collect-all customtkinter `
            --collect-all edr `
            edr/gui.py

      - name: Build Standalone Windows CLI Executable
        run: |
          pyinstaller --noconfirm --onefile --console --name "xedr" `
            --collect-all edr `
            edr/cli.py

      - name: Package Windows Artifacts
        run: |
          Compress-Archive -Path dist/exploidus-edr-gui -DestinationPath dist/exploidus-edr-gui-windows-x64.zip
          Compress-Archive -Path dist/xedr.exe -DestinationPath dist/xedr-cli-windows-x64.zip

      - name: Upload Windows GUI Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/exploidus-edr-gui-windows-x64.zip
            dist/xedr-cli-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[full]"

      - name: Build Standalone Linux CLI Executable
        run: |
          pyinstaller --noconfirm --onefile --console --name "xedr" \
            --collect-all edr \
            edr/cli.py

      - name: Package Linux Artifact
        run: |
          tar -czvf dist/xedr-cli-linux-x64.tar.gz -C dist xedr

      - name: Upload Linux Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/xedr-cli-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
